<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS // Arcade</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="app">
        <section id="screen-auth" class="screen active">
            <div class="glass-card auth-box">
                <div class="apple-logo"><i class="fa-solid fa-gamepad"></i></div>
                <h1>NEXUS ID</h1>
                <p class="subtitle">Войдите в экосистему</p>
                <div class="input-group">
                    <input type="text" id="username-input" placeholder="Имя игрока..." autocomplete="off">
                </div>
                <button id="login-btn" class="ios-btn primary">Войти в Лобби</button>
            </div>
        </section>

        <section id="screen-lobby" class="screen">
            <header class="ios-header">
                <div class="user-badge">
                    <div class="avatar"><i class="fa-solid fa-user-astronaut"></i></div>
                    <span id="player-name">Player</span>
                </div>
                <div class="balance-badge">
                    <i class="fa-solid fa-coins" style="color: #FFD60A;"></i>
                    <span id="player-coins">0</span>
                </div>
            </header>

            <main class="lobby-content">
                <div id="tab-games" class="tab-page active">
                    <h2 class="section-title">Игры <span class="game-count">2 / 30</span></h2>
                    <div class="games-grid">
                        
                        <div class="game-card" data-game="snake">
                            <div class="game-cover snake-cover">
                                <i class="fa-solid fa-staff-snake"></i>
                            </div>
                            <div class="game-info">
                                <h3>Neon Snake</h3>
                                <p>Классика в кибер-стиле</p>
                                <span class="tag tag-senior">Senior Ready</span>
                            </div>
                        </div>

                        <div class="game-card" data-game="reactor">
                            <div class="game-cover reactor-cover">
                                <i class="fa-solid fa-bolt"></i>
                            </div>
                            <div class="game-info">
                                <h3>Tap Reactor</h3>
                                <p>Испытание реакции</p>
                                <span class="tag tag-new">New</span>
                            </div>
                        </div>

                        <div class="game-card locked">
                            <div class="game-cover"><i class="fa-solid fa-lock"></i></div>
                            <div class="game-info">
                                <h3>Block Blast</h3>
                                <p>Скоро в обновлении</p>
                            </div>
                        </div>

                    </div>
                </div>

                <div id="tab-shop" class="tab-page">
                    <h2 class="section-title">Скины Неона</h2>
                    <div class="shop-grid" id="skins-container">
                        </div>
                </div>
            </main>

            <nav class="ios-dock">
                <button class="dock-item active" data-tab="tab-games">
                    <i class="fa-solid fa-layer-group"></i>
                    <span>Лобби</span>
                </button>
                <button class="dock-item" data-tab="tab-shop">
                    <i class="fa-solid fa-bag-shopping"></i>
                    <span>Скины</span>
                </button>
                <button class="dock-item" id="logout-btn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Выход</span>
                </button>
            </nav>
        </section>

        <section id="screen-game" class="screen">
            <div class="game-top-bar">
                <button id="exit-game-btn" class="blur-btn"><i class="fa-solid fa-chevron-left"></i> Лобби</button>
                <div class="live-score">Счёт: <span id="current-game-score">0</span></div>
            </div>
            <div id="game-viewport">
                </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
